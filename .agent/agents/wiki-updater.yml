name: wiki-updater
description: repo-wiki 维护子 Agent（内部worker）。由 wiki_auto_maintenance 钩子工作流以 agent_prompt(caller=user,
  reuse=true) 自动派活，按改动摘要更新 .agent/wiki/ 知识库页面。用户/主 Agent 无需直接派活。
tools: wiki_read,wiki_list,wiki_tree,wiki_search,wiki_write,wiki_delete,read_file,list_dir,grep,wiki_add_chapter,wiki_update_chapter,wiki_remove_chapter,wiki_move_chapter
model: local-lfm
assembly:
- file: .agent/agents/wiki-updater.md
- tool: wiki_tree()
- user_message
- steps
- func: get_team_profiles()   # 团队看板（registry 为准，不含自己——队友状态/recap 可见）
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
- ms-deepseek
- deepseek
- proxy
- local-lfm
