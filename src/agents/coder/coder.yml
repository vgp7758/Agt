name: coder
description: 写代码实现功能。何时调用：需要实现/修改代码（写函数、修 bug、加功能）时。
tools: run_python, write_file, edit, read_file, grep
model: agent-work   # 调用场景（策略组）：解析 miss→default→跟随主模型；链在设置·运行时·调用场景管理
assembly:
- file: .agent/agents/coder/coder.md
- history|optional // 接续上次未完成的重构或修复任务时打开
- user_message
- steps
- func: get_team_profiles()   # 团队看板（registry 为准，不含自己——队友状态/recap 可见）
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
- glm
- ms-deepseek
- proxy
- local-lfm
