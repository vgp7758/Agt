<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>插件市场 — Agt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;font-weight:600}
header .sub{color:#8b949e;font-size:12px}
header a{margin-left:auto;color:#58a6ff;text-decoration:none;font-size:13px}
header a:hover{text-decoration:underline}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#161b22;border-bottom:1px solid #30363d;flex-wrap:wrap}
.toolbar input[type=text]{flex:1;min-width:200px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 12px;color:#e6edf3;font-size:13px}
.toolbar input[type=text]:focus{outline:none;border-color:#58a6ff}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:#8b949e;transition:all .15s}
.tab:hover{background:#21262d;color:#e6edf3}
.tab.active{background:#238636;color:#fff}
#list{flex:1;overflow-y:auto;padding:12px 16px}
.mk-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;margin-bottom:10px;transition:border-color .15s}
.mk-card:hover{border-color:#484f58}
.mk-card .head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.mk-card .name{font-weight:600;font-size:14px}
.mk-card .ver{font-family:monospace;font-size:11px;color:#8b949e}
.mk-card .type{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.mk-card .type.workflow{background:#1f6feb33;color:#58a6ff}
.mk-card .type.agent_decl{background:#bc8cff33;color:#bc8cff}
.mk-card .type.plugin{background:#f0883e33;color:#f0883e}
.mk-card .type.skill{background:#23863633;color:#3fb950}
.mk-card .type.tool{background:#da363333;color:#ff7b72}
.mk-card .installed-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#23863633;color:#3fb950;font-weight:600}
.mk-card .installed-badge.global{background:#1f6feb33;color:#58a6ff}
.mk-card .installed-badge.both{background:#bc8cff33;color:#bc8cff}
.mk-card .desc{color:#c9d1d9;font-size:13px}
.mk-card .foot{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk-card .path{font-family:monospace;font-size:11px;color:#484f58}
.mk-card .actions{margin-left:auto;display:flex;gap:6px}
.mk-card .tag{background:#21262d;color:#8b949e;padding:2px 8px;border-radius:8px;font-size:11px}
.btn{padding:5px 12px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e6edf3;cursor:pointer;font-size:13px}
.btn:hover{border-color:#8b949e}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.primary:disabled{opacity:.5;cursor:wait}
.btn.danger{background:#da3633;border-color:#da3633;color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:3px 8px;font-size:12px}
.empty{text-align:center;color:#484f58;padding:60px 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;max-width:80vw;white-space:pre-wrap}
.toast.err{background:#da3633}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>🛒 插件市场</h1>
  <span class="sub" id="counts"></span>
  <a href="/">← 返回主界面</a>
</header>
<div class="toolbar">
  <div class="tabs" id="tabs">
    <div class="tab active" data-type="">全部</div>
    <div class="tab" data-type="workflow">工作流</div>
    <div class="tab" data-type="agent_decl">子Agent</div>
    <div class="tab" data-type="plugin">插件</div>
    <div class="tab" data-type="skill">技能</div>
    <div class="tab" data-type="tool">工具</div>
  </div>
  <input type="text" id="search" placeholder="搜索名称/描述/标签…" oninput="render()">
</div>
<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
let ALL = [], TYPE = '';
const GLOBAL_TYPES = ['workflow', 'skill', 'plugin'];   // 有全局层 ~/.agt 约定的类型
const SCOPE_BADGE = {repo: ['✓ 已装·repo', ''], global: ['✓ 已装·全局', 'global'], both: ['✓ 已装·双层', 'both']};

function badge(x){
  const b = SCOPE_BADGE[x.installed_scope || ''];
  return b ? `<span class="installed-badge ${b[1]}">${b[0]}</span>` : '';
}

function actions(x){
  const n = x.name, scope = x.installed_scope || '';
  const canGlobal = GLOBAL_TYPES.includes(x.type);
  const btns = [];
  if(!scope){
    btns.push(`<button class="btn small primary" id="btn-${n}" onclick="install('${n}','repo')">安装</button>`);
    if(canGlobal)
      btns.push(`<button class="btn small" id="btn-g-${n}" onclick="install('${n}','global')">安装到全局</button>`);
  }else{
    const main = scope === 'global' ? 'global' : 'repo';   // 重装作用于已装那层
    btns.push(`<button class="btn small ghost" onclick="reinstall('${n}','${main}')">重装</button>`);
    if(scope === 'repo' && canGlobal)
      btns.push(`<button class="btn small ghost" onclick="install('${n}','global')">+ 全局</button>`);
    if(scope === 'global' && canGlobal)
      btns.push(`<button class="btn small ghost" onclick="install('${n}','repo')">+ 项目</button>`);
    btns.push(`<button class="btn small danger" onclick="uninstall('${n}','${scope}')">卸载</button>`);
  }
  return btns.join('');
}

async function load(){
  try{
    const r = await fetch('/api/marketplace');
    const d = await r.json();
    ALL = d.items || [];
    document.getElementById('counts').textContent =
      `官方精选 ${d.total} 项 · 已装 ${d.installed_count}` + (d.updated ? ` · 策展 ${d.updated}` : '');
  }catch(e){
    document.getElementById('counts').textContent = '加载失败：' + e;
  }
  render();
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const items = ALL.filter(x =>
    (!TYPE || x.type === TYPE) &&
    (!q || (x.name + ' ' + (x.desc||'') + ' ' + (x.tags||[]).join(' ')).toLowerCase().includes(q)));
  if(!items.length){
    list.innerHTML = '<div class="empty">(无匹配条目)</div>';
    return;
  }
  list.innerHTML = items.map(x => `
    <div class="mk-card">
      <div class="head">
        <span class="name">${x.name}</span>
        <span class="ver">v${x.version||'1.0'}</span>
        <span class="type ${x.type}">${x.type_label||x.type}</span>
        ${badge(x)}
        ${x.tags && x.tags.length ? x.tags.map(t=>`<span class="tag">${t}</span>`).join('') : ''}
      </div>
      <div class="desc">${x.desc||''}</div>
      <div class="foot">
        <span class="path">→ ${x.install_dir}${x.installed_scope === 'global' ? ' ｜ 已装于 ~/.agt' : x.installed_scope === 'both' ? ' ｜ repo + ~/.agt' : ''}</span>
        <div class="actions">${actions(x)}</div>
      </div>
    </div>`).join('');
}

function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), 4200);
}

async function install(name, scope, force){
  ['btn-' + name, 'btn-g-' + name].forEach(id => {
    const b = document.getElementById(id);
    if(b) b.disabled = true;
  });
  try{
    const r = await fetch('/api/marketplace/install', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, scope: scope || 'repo', force: !!force})});
    const d = await r.json();
    if(d.ok){ toast(d.message); await load(); }
    else toast(d.error || '安装失败', true);
  }catch(e){ toast('请求失败：' + e, true); }
}

async function reinstall(name, scope){
  const where = scope === 'global' ? '全局层（~/.agt）' : 'repo 工作区';
  if(!confirm(`「${name}」已安装于${where}，覆盖重装可能丢失你的本地修改。继续？`)) return;
  await install(name, scope, true);
}

async function uninstall(name, scope){
  const where = scope === 'both' ? '（repo 与全局两层都会删除）'
              : scope === 'global' ? '（全局层 ~/.agt）' : '（repo 工作区）';
  if(!confirm(`卸载「${name}」${where}？只删除市场声明的落位文件。`)) return;
  try{
    const r = await fetch('/api/marketplace/uninstall', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name})});
    const d = await r.json();
    if(d.ok){ toast(d.message); await load(); }
    else toast(d.error || '卸载失败', true);
  }catch(e){ toast('请求失败：' + e, true); }
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  TYPE = tab.dataset.type;
  render();
});

load();
</script>
</body>
</html>
