<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作流运行观测 — Agt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f6f8fa;color:#1f2329;padding:20px}
h1{font-size:18px;margin-bottom:4px} .sub{color:#8a9099;font-size:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid #d8dee4;border-radius:10px;padding:16px;margin-bottom:14px;max-width:920px}
.run-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.st-running{background:#fef3c7;color:#92400e;animation:pulse 1.2s infinite}
.st-done{background:#dcfce7;color:#166534} .st-failed{background:#fee2e2;color:#991b1b}
.st-node-running{color:#b45309} .st-node-done{color:#16a34a} .st-node-error{color:#dc2626}
@keyframes pulse{50%{opacity:.5}}
.meta{color:#8a9099;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f6f8fa;text-align:left;padding:8px;border-bottom:1px solid #d8dee4;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #eef1f4;vertical-align:top}
tr.clickable:hover{background:#f0f7ff;cursor:pointer}
.prev{color:#57606a;font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:top}
.dur{font-variant-numeric:tabular-nums;white-space:nowrap;color:#57606a}
a{color:#0969da;text-decoration:none} a:hover{text-decoration:underline}
.empty{color:#8a9099;padding:30px;text-align:center}
#nodes td:first-child{white-space:nowrap}
.gantt{height:6px;background:#eef1f4;border-radius:3px;position:relative;min-width:80px}
.gantt>i{position:absolute;top:0;height:100%;border-radius:3px;background:#3fb950}
.gantt>i.run{background:#f59e0b}
</style>
</head>
<body>
<h1>🔬 工作流运行观测</h1>
<div class="sub">对话中触发的工作流实时执行轨迹（钩子 / wf_* 工具调用）。<span id="mode"></span></div>

<div id="runHead" class="card" style="display:none">
  <div class="run-head">
    <span id="rName" style="font-size:16px;font-weight:600"></span>
    <span id="rHook" class="meta"></span>
    <span id="rStatus" class="badge"></span>
    <span id="rTime" class="meta"></span>
    <span id="rDur" class="meta"></span>
    <a href="/wf/monitor" style="margin-left:auto">← 运行列表</a>
    <button id="btnDebug" style="display:none;margin-left:8px;padding:2px 8px;font-size:12px;border:1px solid #d8dee4;border-radius:6px;background:#fff;cursor:pointer" title="把此次执行的画布+上下文载入调试页查看">🔬 在调试页查看</button>
  </div>
</div>
<div id="nodesCard" class="card" style="display:none">
  <table id="nodes"><thead><tr>
    <th>#</th><th>节点</th><th>类型</th><th>状态</th><th>耗时</th><th>时间线</th><th>输出预览</th>
  </tr></thead><tbody></tbody></table>
</div>
<div id="listCard" class="card">
  <table id="runsList"><thead><tr>
    <th>run_id</th><th>工作流</th><th>hook</th><th>状态</th><th>节点数</th><th>开始时间</th><th>耗时</th>
  </tr></thead><tbody></tbody></table>
  <div id="emptyList" class="empty" style="display:none">暂无运行记录（对话中触发钩子 / wf_* 工具后出现在这里）</div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const runId = qs.get("run") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = ts => ts ? new Date(ts*1000).toLocaleTimeString('zh-CN',{hour12:false}) : "";
const fmtDur = ms => ms==null ? "" : (ms<1000 ? ms+"ms" : (ms/1000).toFixed(1)+"s");

const NTYPES = {"1":"开始","2":"结束","3":"LLM","5":"代码","8":"选择器","15":"文本","21":"循环",
  "22":"意图","28":"批处理","32":"聚合","40":"赋值","45":"HTTP","9":"子工作流","4":"工具","13":"输出","58":"ToJSON","59":"FromJSON"};

let timer = null, lastNodes = 0, lastRun = null;
// 展开的嵌套节点（复合/子工作流）：node id 集合——2s 轮询重渲染时保持展开态
const _expanded = new Set();

function stopPoll(){ if(timer){clearInterval(timer); timer=null;} }

// 子节点轨迹表（复合=最后一轮迭代；子工作流=完整子执行）。children 元素自带 title/ntype/status/dur/preview
function childTableHTML(n){
  const kids = n.children || [];
  const head = n.wf_name
    ? `🔗 子工作流 <b>${esc(n.wf_name)}</b> · ${kids.length} 个节点`
    : `♻ 共 ${n.rounds || 0} 轮 · 最后一轮迭代轨迹（${kids.length} 节点）`;
  let rows = kids.map((c, i) => {
    const st = c.status==="running" ? '<span class="st-node-running">⏳</span>'
             : c.status==="error" ? '<span class="st-node-error">❌</span>'
             : '<span class="st-node-done">✓</span>';
    return `<tr><td class="meta">${i+1}</td>
      <td><b>${esc(c.title)}</b> <span class="meta">${esc(c.id)}</span></td>
      <td>${esc(NTYPES[c.ntype] || c.ntype || "")}</td><td>${st}</td>
      <td class="dur">${c.dur_ms!=null?fmtDur(c.dur_ms):(c.status==="running"?"…":"")}</td>
      <td></td>
      <td><span class="prev" title="${esc(c.preview)}">${esc(c.preview)}</span></td></tr>`;
  }).join("");
  if(!rows) rows = `<tr><td colspan="7" class="empty">（暂无子节点轨迹）</td></tr>`;
  return `<div style="padding:2px 0 4px 14px">
    <div class="meta" style="margin:6px 0 4px">${head}</div>
    <table style="background:#fafbfc;border:1px solid #eef1f4;border-radius:8px">
      <thead><tr><th>#</th><th>子节点</th><th>类型</th><th>状态</th><th>耗时</th><th></th><th>输出预览</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

// 主行后的展开行同步：展开且有时渲染/更新；收起或无 children 时移除
function syncChildRow(n, mainTr){
  let cr = mainTr.nextSibling;
  while(cr && !(cr.tagName==="TR" && cr.classList.contains("childrow") && cr.dataset.for===n.id))
    cr = cr.nextSibling;
  const want = _expanded.has(n.id) && Array.isArray(n.children);
  if(!want){ if(cr) cr.remove(); return; }
  if(!cr){
    cr = document.createElement("tr");
    cr.className = "childrow"; cr.dataset.for = n.id;
    const td = document.createElement("td");
    td.colSpan = 7; td.style.background = "#fbfcfd";
    cr.appendChild(td);
    mainTr.after(cr);
  }
  cr.cells[0].innerHTML = childTableHTML(n);
}

function toggleExpand(nid){
  if(_expanded.has(nid)) _expanded.delete(nid); else _expanded.add(nid);
  if(lastRun) renderRun(lastRun);   // 用缓存数据立即重画（不等下一轮轮询）
}

function renderRun(r){
  lastRun = r;
  $("runHead").style.display = "";
  $("nodesCard").style.display = "";
  $("listCard").style.display = "none";
  $("rName").textContent = r.name;
  $("rHook").textContent = (r.hook==="tool" ? "wf_* 工具调用" : "钩子 "+r.hook);
  const st = $("rStatus");
  st.className = "badge st-" + r.status;
  st.textContent = r.status==="running" ? "⏳ 执行中" : (r.status==="done" ? "✅ 完成" : "❌ 失败");
  $("rTime").textContent = "开始 " + fmtT(r.started_at);
  $("rDur").textContent = r.finished_at ? "总耗时 " + fmtDur((r.finished_at-r.started_at)*1000) : "";
  // 节点表
  const tb = $("nodes").tBodies[0];
  // 增量 append（按 mainrow 过滤定位——展开行 childrow 不占主行序号）
  const nodes = r.nodes || [];
  const t0 = r.started_at, tEnd = r.finished_at || Date.now()/1000;
  const span = Math.max(0.001, tEnd - t0);
  const mains = () => Array.from(tb.rows).filter(x => x.classList.contains("mainrow"));
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    let tr = mains()[i];
    if(!tr){
      tr = tb.insertRow(-1);
      tr.className = "mainrow"; tr.dataset.nid = n.id;
      for(let k=0;k<7;k++) tr.insertCell(-1);
    }
    const cells = tr.cells;
    cells[0].textContent = i+1;
    // 嵌套节点（复合/子工作流）可点击展开：▸/▾ + 子节点数/轮数/子工作流名徽章
    if(Array.isArray(n.children)){
      const exp = _expanded.has(n.id);
      tr.classList.add("clickable");
      tr.onclick = ev => { if(ev.target.closest("td:nth-child(7)")) return; toggleExpand(n.id); };
      const badge = n.wf_name
        ? `<span class="meta">🔗 ${esc(n.wf_name)} · ${n.children.length} 节点</span>`
        : `<span class="meta">♻ ${n.rounds||0} 轮 · ${n.children.length} 子节点</span>`;
      cells[1].innerHTML = `${exp?"<b>▾</b>":"<b>▸</b>"} <b>${esc(n.title)}</b> <span class="meta">${esc(n.id)}</span> ${badge}`;
    } else {
      tr.classList.remove("clickable"); tr.onclick = null;
      cells[1].innerHTML = `<b>${esc(n.title)}</b> <span class="meta">${esc(n.id)}</span>`;
    }
    cells[2].textContent = NTYPES[n.ntype] || n.ntype;
    const stn = n.status==="running" ? '<span class="st-node-running">⏳ 运行中</span>'
              : n.status==="error" ? '<span class="st-node-error">❌ 出错</span>'
              : '<span class="st-node-done">✓ 完成</span>';
    cells[3].innerHTML = stn;
    cells[4].className = "dur";
    cells[4].textContent = n.dur_ms!=null ? fmtDur(n.dur_ms) : (n.status==="running" ? "…" : "");
    // 时间线（相对条）
    const s = Math.min(1, Math.max(0, (n.t_start - t0) / span));
    const e = n.t_end ? Math.min(1, (n.t_end - t0) / span) : Math.min(1, (Date.now()/1000 - t0) / span);
    cells[5].innerHTML = `<div class="gantt"><i class="${n.status==="running"?"run":""}" style="left:${(s*100).toFixed(1)}%;width:${Math.max(1,(e-s)*100).toFixed(1)}%"></i></div>`;
    // 预览单元格：has_full 时点击打开 text/plain 全文页（浏览器原生渲染，无样式）
  if(n.has_full){
    cells[6].innerHTML = `<span class="prev" style="cursor:pointer;text-decoration:underline dotted"
      title="点击查看完整输出（纯文本页）" onclick="event.stopPropagation();window.open('/api/wf/runs/${runId}/node/${encodeURIComponent(n.id)}','_blank')">${esc(n.preview)} 📄</span>`;
  } else {
    cells[6].innerHTML = `<span class="prev" title="${esc(n.preview)}">${esc(n.preview)}</span>`;
  }
  // 展开行同步（展开/收起/每轮刷新）
  syncChildRow(n, tr);
  }
  // 完成后停轮询
  if(r.status !== "running") stopPoll();
  // 显示"在调试页查看"按钮（run 完成且注册时存了画布快照）
  const btn = $("btnDebug");
  if(btn){
    btn.style.display = (r.has_canvas && r.status !== "running") ? "" : "none";
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "导入中…";
      try{
        // 单次拉取画布快照（?canvas=1；轮询不含 canvas，避免 2s 重复传输）
        const r2 = await (await fetch("/api/wf/runs/"+encodeURIComponent(runId)+"?canvas=1")).json();
        if(!r2.canvas){ alert("该运行未存画布快照（旧版本注册的运行）"); return; }
        // 节点输出：优先全量（has_full 逐节点拉取），失败/无全文回退 preview
        const outs = {};
        await Promise.all((r2.nodes||[]).map(async n => {
          outs[n.id] = {output: n.preview || ""};
          if(n.has_full){
            try{
              const t = await (await fetch("/api/wf/runs/"+encodeURIComponent(runId)+"/node/"+encodeURIComponent(n.id))).text();
              if(t && !t.startsWith("[无全文]") && !t.startsWith("[不存在]")) outs[n.id] = {output: t};
            }catch(e){}
          }
        }));
        try{
          sessionStorage.setItem("_wf_debug_canvas", JSON.stringify(r2.canvas));
          sessionStorage.setItem("_wf_debug_outputs", JSON.stringify(outs));
          sessionStorage.setItem("_wf_debug_order", JSON.stringify((r2.nodes||[]).map(n => n.id)));
          sessionStorage.setItem("_wf_debug_name", r2.name || "");
        }catch(e){
          // 全量超 sessionStorage 配额：降级为 preview 再存一次
          const lite = {};
          (r2.nodes||[]).forEach(n => lite[n.id] = {output: n.preview || ""});
          sessionStorage.setItem("_wf_debug_outputs", JSON.stringify(lite));
        }
        location.href = "/wfdebug?from=monitor&run=" + encodeURIComponent(runId);
      } finally {
        btn.disabled = false; btn.textContent = "🔬 在调试页查看";
      }
    };
  }
}

function renderList(runs){
  $("listCard").style.display = "";
  const tb = $("runsList").tBodies[0];
  tb.innerHTML = "";
  if(!runs.length){ $("emptyList").style.display = ""; return; }
  for(const r of runs){
    const tr = tb.insertRow(-1);
    tr.className = "clickable";
    tr.onclick = () => location.href = "/wf/monitor?run=" + encodeURIComponent(r.run_id);
    const st = r.status==="running" ? '<span class="badge st-running">执行中</span>'
             : r.status==="done" ? '<span class="badge st-done">完成</span>'
             : '<span class="badge st-failed">失败</span>';
    tr.innerHTML = `<td class="meta">${esc(r.run_id)}</td><td><b>${esc(r.name)}</b></td>
      <td>${r.hook==="tool"?"wf_* 工具":"钩子 "+esc(r.hook)}</td><td>${st}</td>
      <td>${r.node_count}</td><td class="meta">${fmtT(r.started_at)}</td>
      <td class="dur">${r.finished_at?fmtDur((r.finished_at-r.started_at)*1000):"—"}</td>`;
  }
}

async function pollRun(){
  try{
    const r = await (await fetch("/api/wf/runs/"+encodeURIComponent(runId))).json();
    if(r.error){ $("nodesCard").innerHTML = '<div class="empty">'+esc(r.error)+'</div>'; $("nodesCard").style.display=""; stopPoll(); return; }
    renderRun(r);
  }catch(e){ /* 网络抖动继续 */ }
}
async function pollList(){
  try{
    const d = await (await fetch("/api/wf/runs")).json();
    renderList(d.runs || []);
  }catch(e){ /* ignore */ }
}

if(runId){
  $("mode").textContent = "· 单次运行 · 2s 自动刷新";
  pollRun();
  timer = setInterval(pollRun, 2000);
}else{
  $("mode").textContent = "· 最近运行 · 点击行进入观测";
  pollList();
  timer = setInterval(pollList, 3000);
}
</script>
</body>
</html>
