name: Bug 报告
description: Agt 跑出了问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望 vs 实际
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Python 版本 / agt 版本（`pip show agt-agent`）/ 模型与 provider