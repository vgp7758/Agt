name: vision
description: 看懂图片并给出文字描述。何时调用：工具返回 <img>图片</img> 占位、或需理解/分析图片内容时。推荐
  用 agent_prompt 的 images 参数直接附图（框架自动搬运 + 路径自适应）；也可在 prompt 里手写 <img>文件名或路径</img> 标签。
tools: ''
model: qwen
assembly:
- file: .agent/agents/vision/vision.md
- history|optional // 连续看图任务或需要对比之前看过的图片时打开
- user_message
- steps
- func: get_team_profiles()
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
  chain:
  - qwen
  - glm-official-flash
  - kimi
  - local-lfm-vl
  policy: reset
