<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agt Agent</title>
<style>
  :root { --bg:#f5f6f8; --me:#2563eb; --bot:#ffffff; --line:#e2e5ea; --muted:#8a9099; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); display:flex; flex-direction:column; color:#1f2329; }
  header { padding:10px 16px; background:#1f2329; color:#fff; display:flex; align-items:center; gap:10px; }
  header .dot { width:9px;height:9px;border-radius:50%;background:#22c55e; }
  header .dot.off { background:#ef4444; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:#9aa0a6; margin-left:auto; }
  /* 自主模式状态指示器 */
  .auto-badge { background:#7c3aed; color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; margin-left:8px; }
  .auto-badge.hidden { display:none; }
  #msgArea { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:85%; padding:9px 13px; border-radius:13px; line-height:1.55; font-size:14px;
            white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .row.me .bubble { background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .row.bot .bubble { background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .row.sys .bubble { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; font-size:12.5px; max-width:92%; white-space:pre-wrap; }
  .row.err .bubble { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; }
  .gal { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .gal img { width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid rgba(255,255,255,.3); }
  .row.me .gal img { border-color:rgba(255,255,255,.4); }
  details.trace { background:#fff; border:1px solid var(--line); border-radius:10px; padding:5px 10px; font-size:12.5px; color:#4b5158; max-width:85%; }
  details.trace > summary { cursor:pointer; color:var(--muted); user-select:none; }
  .ev { white-space:pre-wrap; word-break:break-word; margin:3px 0; line-height:1.5; }
  .ev.think { color:#9aa0a6; font-style:italic; }
  .ev.tool { color:#1f6feb; }
  .ev.res { color:#5b6470; padding-left:14px; border-left:2px solid var(--line); margin-left:2px; }
  .ev.step { color:var(--muted); font-size:11.5px; margin-top:6px; }
  .ev.warn { color:#b45309; }
  .ev.auto { color:#7c3aed; font-weight:600; }
  .ev.auto.running { animation: pulse 1.5s ease-in-out infinite; }
  .ev.auto.done { color:#059669; }
  .ev.auto.failed { color:#dc2626; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  /* 控件栏 */
  #controls { display:flex; gap:8px; padding:8px 12px; background:#fff; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  /* 手机端：控件区默认隐藏，点 + 按钮从输入框下方滑出 */
  @media (max-width:768px){
    #controls{ display:none; }
    #controls.mobile-show{ display:flex; position:fixed; bottom:120px; left:0; right:0; z-index:50;
      max-height:40vh; overflow-y:auto; box-shadow:0 -4px 12px rgba(0,0,0,.1); border-radius:12px 12px 0 0; }
    #sendBtn.mobile-plus{ width:46px; height:46px; min-width:46px; padding:0; border-radius:50%;
      font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center; }
  }
  #modelSel { padding:5px 8px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; max-width:240px; }
  .btn { padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12.5px; cursor:pointer; color:#374151; }
  .btn:hover { background:#f3f4f6; }
  .btn.primary { background:var(--me); color:#fff; border-color:var(--me); }
  .btn.auto { background:#7c3aed; color:#fff; border-color:#7c3aed; }
  .btn.spacer { margin-left:auto; }
  /* 附件 */
  #attBar { display:none; gap:8px; padding:6px 12px 0; background:#fff; flex-wrap:wrap; }
  .thumb { position:relative; }
  .thumb img { width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .thumb .rm { position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff; width:18px; height:18px;
               border-radius:50%; font-size:12px; line-height:18px; text-align:center; cursor:pointer; }
  #inputBar { display:flex; gap:10px; padding:10px 12px; background:#fff; border-top:1px solid var(--line); }
  #inp { flex:1; resize:none; height:46px; max-height:140px; padding:9px 12px; border:1px solid var(--line); border-radius:10px;
         font-size:14px; font-family:inherit; outline:none; }
  #inp:focus { border-color:var(--me); }
  #sendBtn { padding:0 18px; border:none; background:var(--me); color:#fff; border-radius:10px; font-size:14px; cursor:pointer; }
  #sendBtn:disabled { background:#9aa0a6; cursor:not-allowed; }
  /* 自主模式下发送按钮样式 */
  #sendBtn.auto-active { background:#7c3aed; }
  .restore-btn { display:block; margin-bottom:6px; font-size:11px; padding:3px 8px; border-radius:6px;
    border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.15); color:#fff; cursor:pointer; }
  .restore-btn:hover { background:rgba(255,255,255,.3); }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal { background:#fff; padding:18px 20px; border-radius:12px; min-width:320px; display:flex; flex-direction:column; gap:10px; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 4px; font-size:15px; }
  .modal label { display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:10px; }
  .modal input[type=number]{ width:130px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  /* 设置弹窗 tab 分页 */
  .settings-tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); }
  .settings-tabs .tab-btn { padding:8px 16px; border:none; background:none; cursor:pointer; font-size:13px;
    color:#8a9099; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .settings-tabs .tab-btn:hover { color:#5b6470; }
  .settings-tabs .tab-btn.active { color:var(--me); border-bottom-color:var(--me); font-weight:600; }
  .settings-panel { display:none; flex:1; min-height:0; }
  .settings-panel.active { display:flex; flex-direction:column; }
  /* 运行时参数：分组标题 + 行间距，避免拥挤 */
  #panel-runtime { overflow-y:auto; padding-right:4px; }
  #panel-runtime label { padding:8px 0; border-bottom:1px solid #f1f3f5; }
  .rt-group { font-size:12px; color:#8a9099; font-weight:600; margin:14px 0 2px; letter-spacing:.5px; }
  .rt-group:first-child { margin-top:2px; }
  /* 模型列表项 */
  .model-item { margin:6px 0; padding:10px 12px; background:#f9fafb; border:1px solid var(--line); border-radius:10px; font-size:12px; display:flex; flex-direction:column; gap:5px; }
  .model-item .mi-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .model-item .mi-name { font-weight:600; font-size:13px; color:#1f2329; min-width:70px; }
  .model-item .mi-badge { font-size:10px; padding:1px 6px; border-radius:8px; font-weight:500; }
  .model-item .mi-badge.default { background:#dcfce7; color:#166534; }
  .model-item .mi-badge.thinking { background:#ede9fe; color:#6d28d9; }
  .model-item .mi-badge.vision { background:#dcfce7; color:#166534; }
  .model-item input[type="text"], .model-item input[type="password"] { padding:4px 7px; border:1px solid var(--line); border-radius:6px; font-size:12px; flex:1; min-width:110px; outline:none; }
  .model-item input[type="text"]:focus, .model-item input[type="password"]:focus { border-color:var(--me); }
  .model-item label.mi-check { display:flex; align-items:center; gap:3px; font-size:11px; color:#5b6470; cursor:pointer; white-space:nowrap; }
  .model-item .mi-del { width:20px; height:20px; border-radius:50%; border:1px solid var(--line); background:#fff; color:#ef4444; font-size:14px; line-height:18px; cursor:pointer; padding:0; flex-shrink:0; }
  .model-item .mi-del:hover { background:#fef2f2; }
  .model-item .mi-btn { font-size:11px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; white-space:nowrap; color:#374151; }
  .model-item .mi-btn:hover { background:#f3f4f6; }
  .model-item .mi-btn.set-default { color:#059669; border-color:#a7f3d0; }
  .model-item .mi-btn.set-default:hover { background:#ecfdf5; }
  .plan-panel { background:#fff; border-bottom:1px solid var(--line); padding:6px 14px; font-size:13px; max-height:200px; overflow-y:auto; }
  .plan-panel summary { cursor:pointer; font-weight:600; color:#374151; }
  .plan-item { display:flex; gap:6px; align-items:center; padding:2px 0; }
  .plan-item .pi { width:20px; text-align:center; }
  /* spec 面板（施工方案） */
  #specPanel { max-height:320px; background:#fafbff; }
  #specPanel summary { color:#4338ca; }
  .spec-item { padding:4px 0; border-left:3px solid #c7d2fe; padding-left:8px; margin:2px 0; }
  .spec-item .spec-head { font-weight:600; color:#4338ca; }
  .spec-item .spec-file { color:#7c3aed; font-size:12px; }
  .spec-item .spec-anc { color:#8a9099; font-size:11px; }
  .spec-item .spec-content { font-size:12px; color:#374151; white-space:pre-wrap; background:#f0f4ff; padding:2px 6px; border-radius:3px; margin-top:2px; max-height:120px; overflow:auto; }
  .spec-item .spec-rat { font-size:11px; color:#6b7280; margin-top:2px; }
  .spec-review-bar { margin:6px 0; padding:6px 10px; background:#eef2ff; border-radius:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .spec-btn { font-size:12px; padding:3px 12px; border-radius:4px; cursor:pointer; border:1px solid; }
  .spec-btn.approve { color:#059669; border-color:#a7f3d0; background:#ecfdf5; }
  .spec-btn.approve:hover { background:#d1fae5; }
  .spec-btn.reject { color:#dc2626; border-color:#fca5a5; background:#fef2f2; }
  .spec-btn.reject:hover { background:#fee2e2; }
  .spec-state { font-size:11px; padding:1px 8px; border-radius:8px; font-weight:600; }
  .spec-state.draft { background:#e0e7ff; color:#4338ca; }
  .spec-state.committed { background:#fde68a; color:#92400e; }
  .spec-state.approved { background:#d1fae5; color:#065f46; }
  .spec-state.rejected { background:#fee2e2; color:#991b1b; }
  .spec-fb { width:100%; font-size:12px; padding:4px 6px; border:1px solid #fca5a5; border-radius:4px; margin-top:4px; }
  /* 统计弹窗表格 */
  .stats-scope { font-size:12px; color:#8a9099; margin-bottom:8px; }
  .stats-empty { font-size:13px; color:#8a9099; padding:24px 8px; text-align:center; line-height:1.8; }
  .stats-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .stats-table th,.stats-table td { border:1px solid var(--line); padding:5px 8px; text-align:left; }
  .stats-table thead th { background:#f0f2f5; font-weight:600; position:sticky; top:0; z-index:1; white-space:nowrap; }
  .stats-table td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  /* 队列消息提示 */
  #queueStatus { font-size:12px; color:#7c3aed; padding:4px 12px; background:#f3e8ff; display:none; }
  #queueStatus.show { display:block; }
  /* edit / write_file diff 渲染 */
  .diff-head { font-weight:600; color:#3b82f6; margin-bottom:4px; }
  .diff-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .diff-col-h { font-size:11px; color:#8a9099; margin-bottom:2px; }
  .diff-ins { margin-bottom:6px; border-left:3px solid #3b82f6; padding-left:6px; }
  .diff-ins-h { font-size:12px; color:#3b82f6; font-weight:600; margin-bottom:2px; }
  .ev pre.diff-old, .ev pre.diff-new { margin:0; max-height:420px; overflow:auto; font-size:12px; line-height:1.45; padding:6px 8px; border-radius:4px; white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,Menlo,Consolas,monospace; }
  pre.diff-old { background:#3a1410; color:#f8b4b4; }
  pre.diff-new { background:#102a16; color:#a8f0a8; }
  /* —— LLM 回答里的 markdown 表格 / 代码块渲染（renderAnswer 注入）—— */
  .bubble .md-p { margin:0; white-space:pre-wrap; word-break:break-word; }
  .bubble table { border-collapse:collapse; margin:8px 0; font-size:13px; max-width:100%; }
  .bubble th,.bubble td { border:1px solid var(--line); padding:4px 8px; text-align:left; white-space:normal; }
  .bubble thead th { background:#f0f2f5; }
  .bubble pre.code { margin:8px 0; padding:10px 12px; background:#f6f8fa; color:#1f2329;
    border:1px solid var(--line); border-radius:8px; overflow:auto; white-space:pre;
    word-break:normal; overflow-wrap:normal; font:12.5px ui-monospace,Menlo,Consolas,monospace; }
  .bubble pre.code code { background:transparent; padding:0; font:inherit; color:inherit; }
  .run-btn { display:inline-block; margin:4px 0 8px; padding:3px 12px; background:#2563eb; color:#fff;
    border:none; border-radius:6px; font-size:12px; cursor:pointer; }
  .run-btn:hover { background:#1d4ed8; }
  .run-btn:disabled { background:#9aa0a6; cursor:not-allowed; }
  .run-btn.terminal { background:#059669; }
  .run-btn.terminal:hover { background:#047857; }
  .bubble code { background:#f0f2f5; padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em; }
  .row.me .bubble code { background:rgba(255,255,255,.22); }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1 id="sessionTitle">Agt Agent</h1>
    <span class="sub" id="status">连接中…</span>
    <span class="auto-badge hidden" id="autoBadge">🔁 自主模式</span>
    <button id="reconnectBtn" class="btn primary" style="display:none;margin-left:auto" onclick="manualReconnect()">🔄 重连</button>
  </header>

  <div id="planPanel" class="plan-panel" style="display:none"><details open><summary id="planSummary">📋 计划清单</summary><div id="planList"></div></details></div>
  <div id="specPanel" class="plan-panel" style="display:none"><details open><summary id="specSummary">📐 施工方案</summary><div id="specList"></div></details></div>
  <div id="queueStatus">📨 已有 <span id="queueCount">0</span> 条消息在队列中，将在当前任务完成后处理</div>

  <div id="wfPanel" class="plan-panel" style="display:none"><details open>
    <summary>🧩 工作流（点 <b>调试</b> 运行工作流 · <a href="#" id="wfReload">🔄 重载</a>）</summary>
    <div id="wfList"></div>
  </details></div>

  <div id="msgArea"></div>

  <div id="attBar"></div>

  <div id="controls">
    <select id="modelSel" title="切换模型"></select>
    <button class="btn" id="btnImg">📁 加图</button>
    <button class="btn" id="btnToolCall" title="工具调用表单：选工具→填参数→生成 /call 命令发送">🔧 工具</button>
    <button class="btn" id="btnWf" title="工作流：查看/重载/调试运行">🧩 工作流</button>
    <button class="btn" id="btnEditor" onclick="window.open('/editor','_blank')" title="可视化工作流编辑器">✏ 编辑器</button>
    <button class="btn" id="btnRag" onclick="window.open('/rag','_blank')" title="RAG 文档库管理">📚 RAG</button>
    <button class="btn" id="btnSave" title="保存当前会话（下拉框选中已有存档则覆盖）">💾 /save</button>
    <select id="sessionSel" title="会话"><option value="__new__">➕ 新会话</option></select>
    <button class="btn auto" id="btnAuto" title="开启/关闭纯自主模式">🔁 自主</button>
    <button class="btn spacer" id="btnStop" style="display:none">⏹ 停止</button>
    <button class="btn" id="btnFeedback">💬 反馈</button>
    <button class="btn" id="btnSettings">⚙ 设置</button>
    <button class="btn" id="btnStats" title="LLM 调用可靠性统计（per-model 成功/空/截断/错误/耗时）">📊 统计</button>
    <button class="btn spacer" id="btnClear">🚮 清空</button>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
  </div>

  <div id="toolForm" style="display:none;background:#fff;border-top:1px solid var(--line);padding:8px 12px;flex-wrap:wrap;align-items:center;gap:6px">
    <select id="toolSel" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:13px;max-width:200px" onchange="onToolSelChange()"><option value="">选择工具…</option></select>
    <span id="toolParams" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"></span>
    <button class="btn primary" id="toolSend" onclick="sendToolCall()">发送</button>
    <button class="btn" id="toolClose" onclick="exitToolForm()" style="font-size:16px;padding:4px 10px" title="返回普通输入">✕</button>
  </div>
  <div id="inputBar">
    <textarea id="inp" placeholder="输入消息（Enter 发送 / Shift+Enter 换行）；可粘贴或上传图片"></textarea>
    <button id="sendBtn">发送</button>
  </div>

<div id="settingsModal" class="modal-overlay">
  <div class="modal" style="width:90vw;height:90vh;max-width:760px">
    <h3>⚙ 设置</h3>
    <div class="settings-tabs">
      <button class="tab-btn active" onclick="switchSettingsTab('models',this)">模型管理</button>
      <button class="tab-btn" onclick="switchSettingsTab('mcp',this)">MCP</button>
      <button class="tab-btn" onclick="switchSettingsTab('runtime',this)">运行时</button>
    </div>
    <div id="panel-models" class="settings-panel active">
    <div id="modelList" style="flex:1;overflow-y:auto;margin:4px 0"></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
      <button onclick="addModel()" style="font-size:12px">+ 添加模型</button>
      <span style="font-size:10px;color:#8a9099">改完点底部「保存模型配置」写回 ~/.agt/models.json</span>
    </div>
    </div>
    <div id="panel-mcp" class="settings-panel">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <h4 style="margin:0;font-size:13px">MCP Server 配置（.mcp.json）</h4>
      <button onclick="addMcpServer()" style="font-size:11px">+ 添加 Server</button>
      <button class="btn primary" onclick="saveMcpConfig()" style="font-size:11px">💾 保存 MCP</button>
      <span style="font-size:10px;color:#8a9099">保存到 workspace/.mcp.json · 重启 Agent 生效</span>
    </div>
    <div id="mcpList" style="flex:1;overflow-y:auto"></div>
    </div>
    <div id="panel-runtime" class="settings-panel">
    <div class="rt-group">基础参数</div>
    <label>max_steps <input id="cfg_max_steps" type="number"></label>
    <label>token_budget <input id="cfg_token_budget" type="number"></label>
    <label>max_retries <input id="cfg_max_retries" type="number"></label>
    <label>temperature <input id="cfg_temperature" type="number" step="0.1"></label>
    <div class="rt-group">模型与回退</div>
    <label>回退链 <input id="cfg_fallback_chain" type="text" placeholder="glm,deepseek,qwen"></label>
    <label>回退策略 <select id="cfg_fallback_policy" title="回退后下一轮怎么处理：sticky=永久降级；reset=每轮重新从链首尝试">
      <option value="sticky">永久降级（sticky）</option>
      <option value="reset">每轮重试首模型（reset）</option>
    </select></label>
    <label>reasoning补全模型 <select id="cfg_reasoning_completer" title="思考模型只回 reasoning 无 content 时，用此非思考模型据 reasoning 补出正文"><option value="">（关闭）</option></select></label>
    <label>检索模型 retrieval_model <select id="cfg_retrieval_model" title="Agentic RAG 检索（抽关键字+精排）用的便宜模型；留空=用默认模型"><option value="">（用默认模型）</option></select></label>
    <div class="rt-group">执行与上下文</div>
    <label>tool_timeout(秒) <input id="cfg_tool_timeout" type="number" min="1" max="7200" title="run_python/run_shell/run_script 的执行超时"></label>
    <label>分档上限 max_level <input id="cfg_max_level" type="number" min="1" title="分档投影的最高档位（默认4）；超过此级别的老 turn 不再压缩，保住前缀缓存"></label>

<script>
// ===== WS 连接管理（支持自动重连）=====
let ws = null;
let firstConnect = true;
let autoReconnect = localStorage.getItem('autoReconnect') === 'true';
let reconnectTimer = null;

function connectWS(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=>{
    setOnline(true);
    // 无论首次连接还是断线重连，都请求当前内存中的 session 历史——
    // 新设备/新浏览器连上来时也能看到正在进行的会话
    ws.send(JSON.stringify({action:'current_history'}));
    firstConnect = false;
  };
  ws.onclose = ()=>{
    setOnline(false);
    if(autoReconnect){
      inp.placeholder = '连接断开，3 秒后自动重连…';
      reconnectTimer = setTimeout(connectWS, 3000);
    } else {
      inp.placeholder = '连接已断开，请刷新页面';
    }
  };
  ws.onerror = ()=>setOnline(false);
  ws.onmessage = onWSMessage;
}

const msgArea = document.getElementById('msgArea');
const inp = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const modelSel = document.getElementById('modelSel');
const attBar = document.getElementById('attBar');
const fileInput = document.getElementById('fileInput');
const settingsModal = document.getElementById('settingsModal');
const autoBadge = document.getElementById('autoBadge');
const queueStatus = document.getElementById('queueStatus');
const queueCount = document.getElementById('queueCount');

let busy = false;
let autonomousMode = false;
let curTurn = null;
const attachments = []; // data URL 数组
let lastUserBubble = null;      // 最近一条用户气泡（挂检查点按钮用）
let restoreTargetBubble = null; // 回溯目标气泡
let messageQueueSize = 0;
	let runningAutoWf = null;       // 当前正在执行的自动工作流 trace 元素

function scrollBottom(){ msgArea.scrollTop = msgArea.scrollHeight; }
function setBusy(b){
  busy = b;
  // 输入框/发送键常驻可用：忙时发送走"中途注入"（后端按 busy 路由），不再禁用
  sendBtn.disabled = false;
  sendBtn.classList.toggle('auto-active', autonomousMode && b);
  document.getElementById('btnStop').style.display = b ? 'inline-block' : 'none';
  if(b && !autonomousMode){
    inp.placeholder = "处理中… 输入将排队并在下一步注入当前任务（Enter 发送，或点中断）";
  } else if(!b) {
    inp.placeholder = "输入消息，Enter 发送（Shift+Enter 换行）";
    inp.focus();
  }
}
function setOnline(on){
  dot.classList.toggle('off', !on);
  statusEl.textContent = on ? '已连接' : '已断开';
  document.getElementById('reconnectBtn').style.display = on ? 'none' : 'inline-block';
}
function manualReconnect(){
  // 清除自动重连的定时器（避免重复连）
  if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer=null; }
  connectWS();
}
function setAutonomousMode(on){
  autonomousMode = on;
  autoBadge.classList.toggle('hidden', !on);
  // 更新输入框提示
  if(on){
    inp.placeholder = "自主模式进行中… 输入消息将在当前任务完成后插入（Enter 发送）";
  } else {
    inp.placeholder = "输入消息（Enter 发送 / Shift+Enter 换行）；可粘贴或上传图片";
  }
}
function updateQueueStatus(size){
  messageQueueSize = size;
  queueCount.textContent = size;
  queueStatus.classList.toggle('show', size > 0);
}

// —— 更新会话标题 ——
function setSessionTitle(title){
  const el = document.getElementById('sessionTitle');
  if(el) el.textContent = title || '新会话';
}

function addRow(cls, text){
  const row=document.createElement('div'); row.className='row '+cls;
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
  row.appendChild(b); msgArea.appendChild(row); scrollBottom(); return row;
}

function newTurn(){
  const wrap=document.createElement('div'); wrap.className='row bot';
  const col=document.createElement('div'); col.className='turn';
  const det=document.createElement('details'); det.className='trace'; det.open=true;
  const sum=document.createElement('summary'); sum.textContent='过程'; det.appendChild(sum);
  const box=document.createElement('div'); det.appendChild(box);
  const ans=document.createElement('div'); ans.className='bubble';
  col.appendChild(det); col.appendChild(ans); wrap.appendChild(col);
  msgArea.appendChild(wrap);
  curTurn={traceBox:box, answerEl:ans, det};
  scrollBottom();
}
function addTrace(cls, text){
  if(!curTurn) newTurn();
  const e=document.createElement('div'); e.className='ev '+cls; e.textContent=text;
  curTurn.traceBox.appendChild(e); scrollBottom();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 行内 `code` → <code>（在已 esc 的 html 上做；反引号不受 esc 影响）
function inlineCode(h){ return String(h==null?'':h).replace(/`([^`]+)`/g, function(_,c){ return '<code>'+c+'</code>'; }); }
// 表格行 cell 拆分：保护反引号段（code span 内的 | 不切）+ \| 转义还原 + 去首尾 |
function splitCells(row){
  var hold=[];
  row=row.replace(/`[^`]*`/g, function(m){ hold.push(m); return '\x00'+(hold.length-1)+'\x00'; });
  row=row.replace(/\\\|/g,'\x01');                        // \| 转义竖线 → 占位
  row=row.replace(/^\s*\|/,'').replace(/\|\s*$/,'');     // 去首尾 |
  return row.split('|').map(function(c){
    return c.replace(/\x01/g,'|')                         // \| → 字面 |
            .replace(/\x00(\d+)\x00/g, function(_,i){ return hold[+i]; })   // 还原反引号段
            .trim();
  });
}
// 连续表格行 → <table>（合法返回 html 字符串，非法返回 null 交回普通文本）
function tryTable(tbl){
  if(tbl.length<2) return null;
  var header=splitCells(tbl[0]), sep=splitCells(tbl[1]);
  var isSep=sep.length>0 && sep.every(function(c){ return /^:?-+:?$/.test(c.replace(/ /g,'')); });
  if(!isSep) return null;
  var aligns=sep.map(function(c){ c=c.replace(/ /g,''); var L=c.charAt(0)===':', R=c.slice(-1)===':'; return (L&&R)?'center':(R?'right':'left'); });
  var rows=tbl.slice(2).map(splitCells), ncol=header.length;
  function norm(r){ r=r.slice(); while(r.length<ncol) r.push(''); if(r.length>ncol) r=r.slice(0,ncol-1).concat([r.slice(ncol-1).join(' ')]); return r; }
  header=norm(header); rows=rows.map(norm);
  function cell(c,tag,align){ return '<'+tag+(align&&align!=='left'?' style="text-align:'+align+'"':'')+'>'+inlineCode(esc(c))+'</'+tag+'>'; }
  var html='<table><thead><tr>'+header.map(function(c,i){ return cell(c,'th',aligns[i]); }).join('')+'</tr></thead>';
  if(rows.length) html+='<tbody>'+rows.map(function(r){ return '<tr>'+r.map(function(c){ return cell(c,'td','left'); }).join('')+'</tr>'; }).join('')+'</tbody>';
  return html+'</table>';
}
// LLM 回答 → HTML：表格→<table>，```代码块```→<pre>，其余→<div class="md-p">（保留换行）。逐行先判围栏再判表格，代码块内的 | 不会被表吞。
function renderAnswer(text){
  var lines=String(text==null?'':text).split('\n'), out=[], buf=[], i=0, n=lines.length;
  function flush(){ if(buf.length){ out.push('<div class="md-p">'+inlineCode(esc(buf.join('\n')))+'</div>'); buf=[]; } }
  while(i<n){
    var line=lines[i], s=line.trim();
    if(/^```/.test(s)){                                  // fenced code（围栏优先）
      flush(); i++; var code=[];
      while(i<n && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      i++;                                               // 跳闭合围栏
      var lang = s.replace(/^```/, '').trim();           // 语言标识（如 bash/python）
      var codeText = code.join('\n');
      var html = '<pre class="code"><code>'+esc(codeText)+'</code></pre>';
      // bash/sh 代码块：加执行按钮（一点击发 /call run_shell）
      if(lang === 'bash' || lang === 'sh' || lang === 'shell' || lang === 'shellscript'){
        var cmd = esc(codeText).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        html += '<div style="margin:4px 0 8px;display:flex;gap:6px">';
        html += '<button class="run-btn" onclick="runShellCode(this)" data-code="'+cmd+'" title="通过 Agent 执行（结果在聊天窗口显示）">▶ Agent执行</button>';
        html += '<button class="run-btn terminal" onclick="openTerminal(this)" data-code="'+cmd+'" title="在独立终端窗口执行">💻 终端执行</button>';
        html += '</div>';
      }
      out.push(html);
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line)){                     // table
      var tbl=[];
      while(i<n && /^\s*\|.*\|\s*$/.test(lines[i])){ tbl.push(lines[i]); i++; }
      var h=tryTable(tbl);
      if(h!==null){ flush(); out.push(h); } else { buf=buf.concat(tbl); }   // 非法表→普通文本
      continue;
    }
    buf.push(line); i++;
  }
  flush();
  return out.join('');
}
function addTraceHTML(cls, html){
  if(!curTurn) newTurn();
  const e=document.createElement('div'); e.className='ev '+cls; e.innerHTML=html;
  curTurn.traceBox.appendChild(e); scrollBottom();
}
// edit=old/new 左右两栏对照；write_file=新建内容预览；其它返回 null（回退到默认文本）
function toolCallHTML(name, a){
  if(name==='edit' && a){
    return `<div class="diff-head">✏️ edit ${esc(a.path||'')}</div>`+
      `<div class="diff-grid"><div class="diff-col"><div class="diff-col-h">old_string</div><pre class="diff-old">${esc(a.old_string||'')}</pre></div>`+
      `<div class="diff-col"><div class="diff-col-h">new_string</div><pre class="diff-new">${esc(a.new_string||'')}</pre></div></div>`;
  }
  if(name==='insert' && a && a.entries){
    let parts=`<div class="diff-head">✏️ insert ${esc(a.path||'')}（${a.entries.length} 处）</div>`;
    a.entries.forEach(e=>{
      parts+=`<div class="diff-ins"><div class="diff-ins-h">→ ${esc(e.line)}</div><pre class="diff-new">${esc(e.content||'')}</pre></div>`;
    });
    return parts;
  }
  if(name==='run_python' && a && a.code){
    const lines=(a.code||'').split('\n');
    return `<div class="diff-head">🔧 run_python ${a.file?esc(a.file):'(inline)'}（${lines.length} 行）</div>`+
      `<pre class="diff-new">${esc(a.code||'')}</pre>`;
  }
  if(name==='write_file' && a){
    const c=a.content||'', lines=c.split('\n');
    return `<div class="diff-head">📝 write_file ${esc(a.path||'')}（新建 · ${lines.length} 行）</div>`+
      `<pre class="diff-new">${esc(c)}</pre>`;
  }
  return null;
}
function renderToolCall(name, args){
  const html=toolCallHTML(name, args);
  if(html) addTraceHTML('tool', html); else addTrace('tool', `🔧 ${name}(${fmtArgs(args)})`);
}
function finishAnswer(text){
  if(!curTurn) newTurn();
  curTurn.answerEl.innerHTML=renderAnswer(text);
  if(curTurn.det) curTurn.det.open=false;
  scrollBottom();
}
function renderHistory(turns){
  // 把一个 session 的完整历史原样渲染成对话：每轮 = 用户气泡 + 过程trace + 回答气泡
  msgArea.innerHTML=''; curTurn=null; lastUserBubble=null;
  if(!turns || !turns.length) return;
  turns.forEach(t=>{
    addUserBubble(t.user||'', null);
    newTurn();
    (t.steps||[]).forEach(s=>{
      if(s.reasoning) addTrace('think','💭 '+s.reasoning);
      (s.tool_calls||[]).forEach(tc=>{
        renderToolCall(tc.name, tc.arguments);
        if(tc.result) addTrace('res', '→ '+tc.result);
      });
    });
    if(t.answer_reasoning) addTrace('think','💭(回答推理) '+t.answer_reasoning);
    if(curTurn.traceBox.children.length===0 && curTurn.det) curTurn.det.style.display='none';
    finishAnswer(t.answer||'(无回答)');
  });
  scrollBottom();
}

// —— 图片附件 ——
function renderThumbs(){
  attBar.innerHTML='';
  attachments.forEach((src,i)=>{
    const d=document.createElement('div'); d.className='thumb';
    const img=document.createElement('img'); img.src=src;
    const x=document.createElement('span'); x.textContent='×'; x.className='rm';
    x.onclick=()=>{ attachments.splice(i,1); renderThumbs(); };
    d.appendChild(img); d.appendChild(x); attBar.appendChild(d);
  });
  attBar.style.display = attachments.length?'flex':'none';
}
function addImageFile(file){
  const r=new FileReader();
  r.onload=()=>{ attachments.push(r.result); renderThumbs(); };
  r.readAsDataURL(file);
}
document.addEventListener('paste', e=>{
  const items = e.clipboardData?.items || [];
  for(const it of items){ if(it.type.startsWith('image/')){ const f=it.getAsFile(); if(f) addImageFile(f); } }
});
fileInput.addEventListener('change', e=>{
  for(const f of e.target.files) addImageFile(f);
  e.target.value='';
});

// —— 发送 ——
function sendRaw(text, images){
  ws.send(JSON.stringify({text, images: images||[]}));
}
function sendInsertMessage(text, imgs){
  // 自主模式下插入消息（即使 busy；当前不带图片，预留 imgs）
  ws.send(JSON.stringify({action:'insert_message', text}));
}
function addUserBubble(text, imgs){
  const row=document.createElement('div'); row.className='row me';
  const b=document.createElement('div'); b.className='bubble';
  if(text){ const t=document.createElement('div'); t.textContent=text; b.appendChild(t); }
  if(imgs && imgs.length){
    const gal=document.createElement('div'); gal.className='gal';
    imgs.forEach(s=>{ const im=document.createElement('img'); im.src=s; gal.appendChild(im); });
    b.appendChild(gal);
  }
  row.appendChild(b); msgArea.appendChild(row); scrollBottom();
  return row;
}
function send(){
  const t=inp.value.trim();
  if(!t && !attachments.length) return;
  // 自主模式且 busy 时，插入消息到队列
  if(busy && autonomousMode){
    const imgs=attachments.slice();
    sendInsertMessage(t, imgs);
    lastUserBubble = addUserBubble(t, imgs);
    inp.value=''; inp.style.height='auto';
    attachments.length=0; renderThumbs();
    return;
  }
  // 普通模式（含忙时）：照常发送——后端按 busy 路由（忙→中途注入下一步，闲→下一轮），不再丢弃
  const imgs=attachments.slice();
  sendRaw(t, imgs);
  lastUserBubble = addUserBubble(t, imgs);
  inp.value=''; inp.style.height='auto';
  attachments.length=0; renderThumbs();
  if(!t.startsWith('/') && !busy){ setBusy(true); curTurn=null; }  // 仅空闲新轮才置 busy；忙时是插话不切轮
}

// —— 按钮 ——
sendBtn.onclick=send;
document.getElementById('btnImg').onclick=()=>fileInput.click();
// ===== bash 代码块执行按钮 =====
function runShellCode(btn){
  var code = btn.dataset.code;
  // 发送 /call run_shell({"command":"..."})，结果在聊天窗口显示
  var cmd = '/call run_shell({"command":' + JSON.stringify(code) + '})';
  ws.send(JSON.stringify({text: cmd, images: []}));
  btn.disabled = true; btn.textContent = '✓ 已发送';
  setTimeout(function(){ btn.disabled = false; btn.textContent = '▶ Agent执行'; }, 2000);
}
function openTerminal(btn){
  var code = btn.dataset.code;
  // 在 cwd 弹出 cmd 窗口执行
  ws.send(JSON.stringify({action: 'open_terminal', command: code}));
  btn.disabled = true; btn.textContent = '✓ 已打开';
  setTimeout(function(){ btn.disabled = false; btn.textContent = '💻 终端执行'; }, 2000);
}
// ===== 工具调用表单模式 =====
let _toolList = [];   // [{name, display, group, params, description}]
let _toolFormMode = false;
async function loadToolListForForm(){
  try{ const r = await fetch('/api/tools'); const d = await r.json(); _toolList = d.tools||[]; }catch(e){}
}
function renderToolSelect(){
  const sel = document.getElementById('toolSel');
  const groups = {};
  _toolList.forEach(t => { (groups[t.group||'其它'] = groups[t.group||'其它'] || []).push(t); });
  let h = '<option value="">选择工具…</option>';
  for(const [g, tools] of Object.entries(groups)){
    h += `<optgroup label="${g}">`;
    tools.forEach(t => h += `<option value="${t.name}">${t.display||t.name}</option>`);
    h += '</optgroup>';
  }
  sel.innerHTML = h;
}
function onToolSelChange(){
  const sel = document.getElementById('toolSel');
  const t = _toolList.find(x => x.name === sel.value);
  const box = document.getElementById('toolParams');
  if(!t){ box.innerHTML=''; return; }
  // 根据 params 生成输入控件
  let h = '';
  (t.params||[]).forEach(p => {
    const nm = p.name; const tp = p.type || 'string';
    if(tp === 'boolean'){
      h += `<label style="font-size:12px">${nm}: <input type="checkbox" id="tp_${nm}" style="width:auto"></label>`;
    }else if(tp === 'integer' || tp === 'number'){
      h += `<input id="tp_${nm}" type="number" placeholder="${nm}" style="width:90px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px">`;
    }else{
      // string：用 text input（对 path 类参数，也可以后续加 file picker）
      const w = nm === 'path' || nm === 'query' ? 200 : 120;
      h += `<input id="tp_${nm}" type="text" placeholder="${nm}" style="width:${w}px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px">`;
    }
  });
  if(!t.params || !t.params.length) h = '<span style="font-size:11px;color:#8a9099">（无参数）</span>';
  box.innerHTML = h;
}
function exitToolForm(){
  _toolFormMode = false;
  document.getElementById('toolForm').style.display = 'none';
  document.getElementById('inputBar').style.display = 'flex';
  const btn = document.getElementById('btnToolCall');
  btn.textContent = '🔧 工具';
  btn.title = '工具调用表单：选工具→填参数→生成 /call 命令发送';
  inp.focus();
}
function sendToolCall(){
  const sel = document.getElementById('toolSel');
  const toolName = sel.value;
  if(!toolName){ toast('⚠️ 请选择工具'); return; }
  const t = _toolList.find(x => x.name === toolName);
  // 收集参数
  const args = {};
  (t.params||[]).forEach(p => {
    const el = document.getElementById('tp_'+p.name);
    if(!el) return;
    const tp = p.type || 'string';
    let v = tp === 'boolean' ? el.checked : el.value;
    if(tp === 'integer' && v !== '') v = parseInt(v);
    else if(tp === 'number' && v !== '') v = parseFloat(v);
    if(v !== '' && v !== false || (tp === 'boolean' && el.checked)) args[p.name] = v;
  });
  // 构造 /call 命令
  const argsStr = Object.keys(args).length ? JSON.stringify(args) : '';
  const cmd = `/call ${toolName}(${argsStr})`;
  // 发送（和普通消息一样走 sendRaw）
  ws.send(JSON.stringify({text: cmd, images: []}));
  addRow('sys', `🔧 已发送：${cmd.replace(/call /, 'call ')}`);
  // 清空参数
  (t.params||[]).forEach(p => { const el = document.getElementById('tp_'+p.name); if(el) el.value = el.type==='checkbox' ? false : ''; });
}

async function loadStats(scope){
  _statsScope=scope;
  const body=document.getElementById('statsBody');
  body.innerHTML='<div class="stats-empty">加载中…</div>';
  try{
    const r=await fetch('/api/stats?scope='+scope); const d=await r.json();
    const s=d.stats||{}; const models=Object.keys(s);
    const scopeText=`范围：${d.scope==='all'?'本仓库全部 session':'当前 session'}（${d.calls} 条调用记录）`;
    if(!models.length){
      body.innerHTML=`<div class="stats-empty">${scopeText}<br>（暂无 LLM 调用记录——发几条消息后刷新看看）</div>`;
      return;
    }
    const cols=['模型','调用','成功(率)','空','截断','错误','completer','tokens','均耗时'];
    let html=`<div class="stats-scope">${scopeText}</div>`;
    html+='<table class="stats-table"><thead><tr>';
    cols.forEach(c=>html+=`<th>${c}</th>`);
    html+='</tr></thead><tbody>';
    models.forEach(m=>{
      const x=s[m];
      const rate=x.calls?(x.success*100/x.calls).toFixed(0)+'%':'—';
      const err=Object.entries(x.errors||{}).map(([k,v])=>`${k}:${v}`).join(' ')||'-';
      // [值, 是否数字列]；模型名+错误列走文字（左对齐/换行），其余右对齐等宽
      const cells=[[esc(m),false],[x.calls,true],[`${x.success}(${rate})`,true],
        [x.empty,true],[x.truncated,true],[err,false],[x.completer,true],
        [x.tokens,true],[x.avg_latency+'s',true]];
      html+='<tr>'+cells.map(c=>`<td${c[1]?' class="num"':''}>${c[0]}</td>`).join('')+'</tr>';
    });
    html+='</tbody></table>';
    body.innerHTML=html;
  }catch(e){ body.innerHTML='<div class="stats-empty">加载失败：'+esc(String(e))+'</div>'; }
}

// step 描述兜底：模型有时把整坨 {"step":1,"description":"...","status":"pending"} 塞进 description，
// 渲染前检查——是 JSON/字面量串就抽出里面的 description 字段，救历史脏数据（新数据后端已清洗）
function unwrapStepDesc(desc){
  if(desc==null) return '';
  if(typeof desc!=='string') return String(desc);
  const s=desc.trim();
  if(!(s.startsWith('{')||s.startsWith('['))) return desc;
  try{ const p=JSON.parse(s); if(p&&typeof p==='object'&&p.description!=null) return String(p.description); }catch(e){}
  try{ const p=JSON.parse(s.replace(/'/g,'"')); if(p&&typeof p==='object'&&p.description!=null) return String(p.description); }catch(e){}
  return desc;
}

    bar.className = 'spec-review-bar';
    const info = document.createElement('span');
    info.textContent = reviewState === 'committed' ? '🔍 等待批阅：' : '❌ 已返工：';
    bar.appendChild(info);
    if (reviewState === 'committed') {
      const approveBtn = document.createElement('button');
      approveBtn.className = 'spec-btn approve';
      approveBtn.textContent = '✅ 通过并开始施工';
      approveBtn.onclick = () => { if (_specActions.approve) _specActions.approve(specId); };
      bar.appendChild(approveBtn);
      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'spec-btn reject';
      rejectBtn.textContent = '❌ 返工（附反馈）';
      rejectBtn.onclick = () => {
        const fb = prompt('请输入返工反馈意见（告诉 Agent 哪里需要改）：');
        if (fb && _specActions.reject) _specActions.reject(specId, fb);
      };
      bar.appendChild(rejectBtn);
    } else if (reviewState === 'rejected') {
      const waiting = document.createElement('span');
      waiting.textContent = '等待 Agent 据反馈重新生成 spec…';
      waiting.style.color = '#991b1b';
      bar.appendChild(waiting);
    }
    panel.insertBefore(bar, list);
  }
  // 步骤列表
  spec.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'spec-item';
    const head = document.createElement('div');
    head.className = 'spec-head';
    head.textContent = (i + 1) + '. [' + (s.action || 'review') + ']';
    row.appendChild(head);
    if (s.file) {
      const file = document.createElement('div');
      file.className = 'spec-file';
      file.textContent = '文件：' + s.file;
      row.appendChild(file);
    }
    if (s.anchor) {
      const anc = document.createElement('div');
      anc.className = 'spec-anc';
      anc.textContent = '定位：' + s.anchor;
      row.appendChild(anc);
    }
    if (s.content) {
      const content = document.createElement('div');
      content.className = 'spec-content';
      content.textContent = s.content;
      row.appendChild(content);
    }
    list.appendChild(row);
  });
}

// —— WS 事件 ——
window.onerror=function(msg,url,line,col,err){console.error(msg,err);try{addRow('err','JS错误: '+(msg+'').slice(0,100));}catch(e){}};
function onWSMessage(ev){
  let m; try{m=JSON.parse(ev.data);}catch{m={type:'error',text:'解析事件失败'};}
  try{
  switch(m.type){
    case 'background_trigger':
      addRow('sys', `⏰ [后台触发·${m.source||''}] ${m.text||''}`); scrollBottom(); break;
    case 'system':
      if(m.models){
        modelSel.innerHTML='';
        m.models.forEach(md=>{
          const o=document.createElement('option'); o.value=md.name;
          o.textContent=md.name + (md.desc?(' — '+md.desc):'');
          if(md.name===m.current_model) o.selected=true;
          modelSel.appendChild(o);
        });
        ws.send(JSON.stringify({action:'list_sessions'}));
      }
      addRow('sys', m.text); scrollBottom(); break;
    case 'checkpoint':
      if(lastUserBubble) attachRestoreButton(lastUserBubble, m.sha);
      break;
    case 'restored':
      if(restoreTargetBubble){
        const kids=[...msgArea.children];
        const idx=kids.indexOf(restoreTargetBubble);
        if(idx>=0) kids.slice(idx).forEach(k=>k.remove());
        restoreTargetBubble=null; curTurn=null; setBusy(false);
      }
      addRow('sys', '✅ 已回溯：工作区文件与对话已恢复到该指令之前。');
      break;
    case 'config':
      if(m.values){
        document.getElementById('cfg_max_steps').value = m.values.max_steps;
        document.getElementById('cfg_token_budget').value = m.values.token_budget;
        document.getElementById('cfg_max_retries').value = m.values.max_retries;
        document.getElementById('cfg_temperature').value = m.values.temperature;
        document.getElementById('cfg_enable_thinking').checked = !!m.values.enable_thinking;
        document.getElementById('cfg_fallback_chain').value = m.values.fallback_chain || '';
        document.getElementById('cfg_fallback_policy').value = m.values.fallback_policy || 'sticky';
        _cfgWanted.cfg_reasoning_completer=m.values.reasoning_completer || '';
        _cfgWanted.cfg_retrieval_model=m.values.retrieval_model || '';
        fillModelSelect('cfg_reasoning_completer','（关闭）');
        fillModelSelect('cfg_retrieval_model','（用默认模型）');
        document.getElementById('cfg_tool_timeout').value = m.values.tool_timeout || '';
        document.getElementById('cfg_max_level').value = m.values.max_level || '';
        document.getElementById('cfg_detail_base').value = m.values.detail_base || '';
        document.getElementById('cfg_detail_step').value = m.values.detail_step || '';
      }
      break;
    case 'saved':
      ws.send(JSON.stringify({action:'list_sessions'}));
      if(m.name){
        window._lastSaved=m.name;
        setSessionTitle(m.name);
      }
      break;
    case 'feedback_meta':
      if(m.kinds){
        const sel=document.getElementById('fbKind'); sel.innerHTML='';
        m.kinds.forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });
      }
      if(m.env){
        document.getElementById('fbEnvPreview').textContent =
          '将附上：' + Object.entries(m.env).map(([k,v])=>k+'='+v).join(' · ');
      }
      if(m.contact){
        const cl=document.getElementById('fbContactLine');
        cl.textContent='直接联系作者：'+m.contact; cl.style.display='block';
      }
      break;
    case 'feedback_result':
      toast(m.text || (m.ok ? '✅ 已提交' : '❌ 提交失败'));
      break;
    case 'plan':
      renderPlan(m.plan, m.plan_id, m.plan_title);
      break;
    case 'spec':
    case 'spec_review':
      renderSpec(m.spec, m.spec_id, m.review_state, m.spec_title);
      // spec_review 态：把批阅动作绑定成「通过/返工」工具调用（发自然语言指令给 Agent）
      if (m.type === 'spec_review' && m.spec_id) {
        _specActions.approve = (sid) => {
          // 通过：让 Agent 调 approve_spec 工具
          sendRaw('请用 approve_spec 工具批准 spec ' + sid + ' 并开始施工', []);
          toast('✅ 已批准，开始施工');
        };
        _specActions.reject = (sid, fb) => {
          // 返工：让 Agent 调 reject_spec 工具并附反馈
          sendRaw('请用 reject_spec 工具返工 spec ' + sid + '，反馈：' + fb, []);
          toast('❌ 已返工，等 Agent 重新生成');
        };
      } else {
        _specActions.approve = null;
        _specActions.reject = null;
      }
      break;
    case 'sessions':
      if(m.names && m.names.length){
        const sel=document.getElementById('sessionSel');
        const curVal=sel.value;
        sel.innerHTML='<option value="__new__">➕ 新会话</option>';
        // m.names 现在是 [{id, name, created_at, turns, first}]
        m.names.forEach(it=>{
          const o=document.createElement('option');
          o.value=it.id;
          // 显示：名字（轮数）+ 创建时间
          const ts = it.created_at ? new Date(it.created_at * 1000).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
          const turnsText = it.turns ? `(${it.turns}轮)` : '';
          o.textContent = `${it.name} ${turnsText}${ts?` · ${ts}`:''}`;
          sel.appendChild(o);
        });
        if(window._lastSaved && sel.querySelector(`option[value="${window._lastSaved}"]`)) sel.value=window._lastSaved;
        else if(curVal && curVal!=='__new__' && sel.querySelector(`option[value="${curVal}"]`)) sel.value=curVal;
        // 初始化标题：如果有上次的存档或当前选中的值，用其 name 字段
        if(window._lastSaved){
          const opt=sel.querySelector(`option[value="${window._lastSaved}"]`);
          if(opt && opt.textContent) setSessionTitle(opt.textContent.split(' ')[0]); // 取名字部分
        } else if(curVal && curVal!=='__new__'){
          const opt=sel.querySelector(`option[value="${curVal}"]`);
          if(opt && opt.textContent) setSessionTitle(opt.textContent.split(' ')[0]);
        }
        window._lastSaved=null;
      }
      break;
    case 'session_history':
      renderHistory(m.turns);
      addRow('sys', `✅ 已恢复会话：${m.name}（${(m.turns||[]).length} 轮完整历史已载入）`);
      setSessionTitle(m.name);  // 加载会话后更新标题
      break;
    case 'session_renamed':
      // Agent 调用 rename_session 工具 / /rename 后，标题即时同步
      if(m.name) setSessionTitle(m.name);
      break;
    case 'error': addRow('err', m.text); setBusy(false); break;
    case 'step': addTrace('step', `— 第 ${m.n} 步 · 累计 ${m.tokens} token${m.model?` · by ${m.model}`:''} —`); break;
    case 'thinking': addTrace('think', '💭 '+m.text); break;
    case 'parallel': addTrace('tool', `⚡ 并行 ${m.count} 个工具`); break;
    case 'tool_call': renderToolCall(m.name, m.arguments); break;
    case 'tool_stream':
      // 流式输出：追加到当前 trace 的最后一个 stream 行，或新建
      if(!curTurn) newTurn();
      const last = curTurn.traceBox.lastElementChild;
      if(last && last.classList.contains('ev') && last.dataset.stream){
        last.textContent += m.text; scrollBottom();
      } else {
        const e=document.createElement('div'); e.className='ev res'; e.dataset.stream='1'; e.textContent=m.text; curTurn.traceBox.appendChild(e); scrollBottom();
      }
      break;
    case 'tool_progress':
      addTrace('warn', `⏳ ${m.name} 运行中 ${m.elapsed}s，${m.lines||0} 行输出`);
      break;
    case 'tool_result': addTrace('res', `→ ${m.result}`); break;
    case 'warn': addTrace('warn', '⚠️ '+m.text); break;
    case 'answer': case 'wrap_answer': finishAnswer(m.text); break;
    case 'wrap_up': addTrace('warn', '⚠️ 触达上限，强制收尾'); break;
    case 'budget_hit': addTrace('warn', '⚠️ 预算用尽'); break;
    case 'interrupted': addRow('sys','⏹ 已中断'); setBusy(false); break;
    case 'autonomous_status':
      setAutonomousMode(!!m.active);
      if(m.active){
        addRow('sys', `🔁 纯自主模式已开启，持续到 ${new Date(m.end_time).toLocaleString()}`);
      } else {
        addRow('sys', '🔁 纯自主模式已关闭');
      }
      break;
    case 'autonomous_continue':
      addTrace('auto', `🔁 自主继续：${m.text}`);
      break;
    case 'autonomous_next':
      addTrace('auto', `🔁 准备下一轮：${m.text}`);
      break;
    case 'message_queued':
      updateQueueStatus(m.queue_size);
      addRow('sys', `📨 消息已入队（当前队列：${m.queue_size} 条）`);
      break;
    case 'message_injected':
      addRow('sys', `📨 用户消息已注入 Agent 上下文：${m.text}`);
      updateQueueStatus(0);
      break;
    case 'workflows':
      renderWorkflows(m.items||[]);
      break;
    case 'coze_url':
      if(m.url){ window.open(m.url, '_blank'); }
      else addRow('sys', '⚠️ 该工作流未配置 coze_url');
      break;
    case 'auto_wf_start':
	      // 自动工作流开始执行：显示带脉冲动画的"执行中"提示
	      if(!curTurn) newTurn();
	      runningAutoWf = document.createElement('div');
	      runningAutoWf.className = 'ev auto running';
	      runningAutoWf.textContent = '⏳ '+wfHookTag(m)+'工作流「'+m.name+'」执行中…';
	      curTurn.traceBox.appendChild(runningAutoWf); scrollBottom();
	      break;
	    case 'auto_wf':
	      // 自动工作流执行完成：更新 running 行为
	      if(runningAutoWf){
	        runningAutoWf.classList.remove('running');
	        runningAutoWf.classList.add('done');
	        runningAutoWf.textContent = '✅ '+wfHookTag(m)+'工作流「'+m.name+'」完成：'+m.text;
	        runningAutoWf = null;
	      } else {
	        addTrace('auto done', '✅ '+wfHookTag(m)+'工作流「'+m.name+'」：'+m.text);
	      }
	      break;
	    case 'auto_wf_error':
	      // 自动工作流执行失败：更新 running 行为
	      if(runningAutoWf){
	        runningAutoWf.classList.remove('running');
	        runningAutoWf.classList.add('failed');
	        runningAutoWf.textContent = '❌ '+wfHookTag(m)+'工作流「'+m.name+'」失败：'+m.text;
	        runningAutoWf = null;
	      } else {
	        addTrace('auto failed', '❌ '+wfHookTag(m)+'工作流「'+m.name+'」失败：'+m.text);
	      }
	      break;
    case 'workflow_message':
      addRow('sys', '💬 '+(m.name?('【'+m.name+'】'):'')+m.text);
      break;
    case '_ping':
      break;  // 心跳，不渲染
    case '_done':
      if(curTurn && !curTurn.answerEl.textContent){
        curTurn.answerEl.textContent='（本轮无最终回答）'; curTurn.answerEl.style.color='#8a9099';
      }
      if(curTurn && curTurn.det) curTurn.det.open=false;
      // 自主模式下不解除 busy 状态（会继续下一轮）
      if(!autonomousMode) setBusy(false);
      break;
  }
  }catch(e){console.error('WS event error:',e);}
}
// 启动首次连接
connectWS();
function fmtArgs(a){ if(a==null) return ''; try{ return typeof a==='object'?JSON.stringify(a):String(a); }catch{ return String(a); } }
// 自动工作流/钩子事件的前缀标签：有 hook 时显示 [位置]，否则显示"自动"
function wfHookTag(m){
  const labels={'before_turn':'每轮开始前','before_tool':'工具调用前','after_tool':'工具调用后','before_answer':'最终回答前'};
  return m && m.hook ? ('['+labels[m.hook]+']钩子') : '自动';
}

function renderWorkflows(items){
  const box=document.getElementById('wfList');
  if(!items.length){ box.innerHTML='<div class="ev" style="color:#8a9099">（无工作流。把 Coze 画布 .json + .json.meta 放进 .agent/workflows/）</div>'; return; }
  const mark={ok:'✅',warn:'⚠️',error:'❌',disabled:'⏸'};
  box.innerHTML=items.map(it=>{
    const desc=it.description?` <span style="color:#8a9099">${it.description}</span>`:'';
    const detail=it.detail?` <span style="color:#e6a23c">— ${it.detail}</span>`:'';
    return `<div class="ev">${mark[it.status]||'•'} <b>${it.tool}</b>${desc}${detail}`+
           ` <a href="/wfdebug?wf=${encodeURIComponent(it.name)}" target="_blank" class="wfDebug" style="margin-left:8px">调试 ↗</a></div>`;
  }).join('');
}
document.getElementById('btnWf').onclick=()=>{
  const p=document.getElementById('wfPanel');
  p.style.display = p.style.display==='none' ? 'block' : 'none';
  ws.send(JSON.stringify({action:'list_workflows'}));
};
document.getElementById('wfReload').onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); ws.send(JSON.stringify({action:'reload_workflows'})); };

inp.focus();
