name: reviewer
description: 审查代码找问题。何时调用：改动后要审查（bug/质量/安全/约定）时。
tools: read_file,grep,list_dir
model: glm-official-flash
assembly:
- file: .agent/agents/reviewer.md
- history|optional // 对照之前的审查结论复查时打开
- user_message
- steps
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
  chain:
  - glm
  - ms-deepseek
  - deepseek-chat
  - local-lfm
  policy: reset
