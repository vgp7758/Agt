name: explorer
description: 只读搜索/定位代码。何时调用：需要在多个文件/目录间搜索、定位定义/引用、只要结论不要全文时。
tools: read_file,grep,list_dir,glob,glob_files
model: glm-official-flash
assembly:
- file: .agent/agents/explorer.md
- history|optional // 需要结合此前搜索发现继续排查时打开
- user_message
- steps
- func: get_team_profiles()   # 团队看板（registry 为准，不含自己——队友状态/recap 可见）
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
- utility
- local-lfm
