name: vision
description: 看懂图片并给出文字描述。何时调用：工具返回 <img>图片</img> 占位、或需理解/分析图片内容时。⚠️ 派活时务必在 prompt
  里带上 <img>文件名</img> 标签引用，否则子 Agent 看不到图片。
tools: ''
model: null
assembly:
- file: .agent/agents/vision.md
- history|optional // 连续看图任务或需要对比之前看过的图片时打开
- user_message
- steps
hooks:
  turn_end:
  - workflow: recap_gen
    async: true
fallback:
  chain:
  - local-lfm-vl
  - qwen
  - kimi
  policy: reset
