<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM 调用统计 — Agt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}
header .sub{color:#8b949e;font-size:12px}
header .spacer{flex:1}
header a{color:#58a6ff;text-decoration:none;font-size:13px}
header a:hover{text-decoration:underline}
.toolbar{display:flex;align-items:center;gap:8px}
.toolbar select,.toolbar button{padding:4px 10px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#e6edf3;font-size:13px;cursor:pointer}
.toolbar button:hover{background:#30363d}
main{flex:1;overflow-y:auto;padding:16px}
.chart-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:16px}
.chart-card h2{font-size:14px;font-weight:600;margin-bottom:10px;color:#e6edf3}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.legend .item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#8b949e;user-select:none}
.legend .item.off{opacity:.35;text-decoration:line-through}
.legend .swatch{width:14px;height:3px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid #21262d;white-space:nowrap}
th{color:#8b949e;font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600}
tr:hover td{background:#161b22}
.good{color:#3fb950}.mid{color:#d29922}.bad{color:#f85149}.dim{color:#8b949e}
svg{display:block;width:100%}
.empty{color:#8b949e;text-align:center;padding:40px 0}
/* ===== 起止范围滑块（双 range 叠加） ===== */
.range-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;padding:2px 2px 10px}
.range-label{font-size:12px;color:#8b949e;white-space:nowrap;min-width:150px}
.range-label b{color:#e6edf3;font-weight:600}
.range-wrap{position:relative;flex:1;height:22px}
.range-track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:#30363d}
.range-fill{position:absolute;top:9px;height:4px;border-radius:2px;background:#58a6ff;opacity:.55}
.range-wrap input[type=range]{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;
  -webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;outline:none}
.range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;
  width:14px;height:14px;border-radius:50%;background:#58a6ff;border:2px solid #0d1117;cursor:ew-resize;
  box-shadow:0 0 0 1px #58a6ff}
.range-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;
  background:#58a6ff;border:2px solid #0d1117;cursor:ew-resize}
.range-wrap input[type=range]:disabled::-webkit-slider-thumb{background:#4b5563;box-shadow:0 0 0 1px #4b5563;cursor:default}
.range-reset{padding:2px 8px;font-size:12px;border:1px solid #30363d;border-radius:6px;background:#21262d;
  color:#8b949e;cursor:pointer;white-space:nowrap}
.range-reset:hover{background:#30363d;color:#e6edf3}
</style>
</head>
<body>
<header>
  <h1>📊 LLM 调用统计</h1>
  <span class="sub" id="subtitle">加载中…</span>
  <div class="spacer"></div>
  <div class="toolbar">
    <select id="scopeSel" title="统计范围">
      <option value="current">当前 session</option>
      <option value="all">全部 session</option>
    </select>
    <button id="btnRefresh">↻ 刷新</button>
  </div>
  <a href="/">← 返回对话</a>
</header>
<main>
  <div class="chart-card">
    <h2>缓存命中率 · 调用序列（等间距）</h2>
    <div class="range-row">
      <span class="range-label" id="rangeLabel">#1 ~ #1</span>
      <div class="range-wrap">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="rLo" min="0" max="0" value="0" disabled>
        <input type="range" id="rHi" min="0" max="0" value="0" disabled>
      </div>
      <button class="range-reset" id="btnResetRange" title="重置为全范围">⟲ 全部</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="chartBox"><div class="empty">暂无数据</div></div>
  </div>
  <div class="chart-card">
    <h2>各端点调用概览 <span class="dim" style="font-weight:400;font-size:12px" id="tableScope"></span></h2>
    <div id="tableBox"><div class="empty">暂无数据</div></div>
  </div>
</main>
<script>
const PALETTE = ['#58a6ff','#3fb950','#f78166','#bc8cff','#f7b731','#ff6b9d','#4dd0e1','#aed581','#e05297','#7dd3fc'];
let _all = [];            // 全部调用记录（ts 升序），每条预计算 ep(端点)/gi(全局下标)
let _range = {lo: 0, hi: 0};   // 选中的窗口（0-based 下标，含端点）
let _rangeTouched = false;     // 用户拖过滑块（刷新后保留窗口）
let _hidden = new Set();  // 隐藏的端点名
let _lastScope = '';

function fmtTs(ts){
  const d = new Date(ts*1000);
  return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}) + ' ' + d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function epOf(r){ const rm=(r.resp_model||'').trim(); return (!rm||rm===r.model)?r.model:(r.model+'/'+rm); }
function fmtK(n){ n=n||0; if(n>=1000000) return (n/1000000).toFixed(1)+'M'; if(n>=1000) return (n/1000).toFixed(1)+'k'; return String(n); }
function rateCls(v){ return v>=80?'good':(v>=40?'mid':'bad'); }

async function load(){
  const scope = document.getElementById('scopeSel').value;
  const keep = _rangeTouched && scope === _lastScope;   // 同范围刷新保留窗口
  const prev = {..._range};
  document.getElementById('subtitle').textContent = '加载中…';
  try{
    const r = await fetch('/api/stats?scope='+scope);
    const d = await r.json();
    _all = (d.records||[]).map((r,i)=>({...r, ep: epOf(r), gi: i}));
    // 滑块范围
    const N = _all.length;
    if(keep){ _range.lo = Math.min(prev.lo, N-1); _range.hi = Math.min(Math.max(prev.hi, _range.lo), N-1); }
    else{
      // 默认窗口 = 最近 200 条（不足则全量）——长会话打开即看近期，不用先拖滑块
      const lo0 = Math.max(0, N - 200);
      _range = {lo: lo0, hi: Math.max(N-1, 0)}; _rangeTouched = false;
    }
    _lastScope = scope;
    setupSlider(N);
    render();
  }catch(e){
    document.getElementById('subtitle').textContent = '加载失败：'+e;
  }
}

// ===== 范围内本地聚合 =====
function aggregate(slice){
  const stats = {};
  for(const c of slice){
    const s = stats[c.ep] ||= {calls:0,success:0,empty:0,truncated:0,errors:{},completer:0,
                               tokens:0,lat_sum:0,cached:0,prompt:0,pts:[]};
    s.calls++;
    if(c.outcome==='success') s.success++;
    else if(c.outcome==='empty') s.empty++;
    else if(c.outcome==='truncated') s.truncated++;
    else if(c.outcome==='error' && c.err) s.errors[c.err]=(s.errors[c.err]||0)+1;
    if(c.completer) s.completer++;
    s.tokens += c.tokens||0;
    s.lat_sum += c.elapsed||0;
    if((c.prompt||0) > 0){
      s.cached += c.cached||0;
      s.prompt += c.prompt;
      s.pts.push({gi:c.gi, ts:c.ts, rate: Math.round(c.cached/c.prompt*1000)/10,
                  cached:c.cached||0, prompt:c.prompt, scene:c.scene||''});
    }
  }
  for(const ep in stats){
    const s = stats[ep];
    s.avg_latency = s.calls ? (s.lat_sum/s.calls).toFixed(1) : '0';
    s.cache_rate = s.prompt ? Math.round(s.cached/s.prompt*1000)/10 : null;
  }
  return stats;
}

function modelColor(models, m){ return PALETTE[models.indexOf(m) % PALETTE.length]; }

function render(){
  const N = _all.length;
  const scopeName = _lastScope === 'all' ? '全部 session' : '当前 session';
  if(!N){
    document.getElementById('subtitle').textContent = scopeName + ' · 暂无 LLM 调用记录';
    document.getElementById('legend').innerHTML = '';
    document.getElementById('chartBox').innerHTML = '<div class="empty">暂无 LLM 调用记录</div>';
    document.getElementById('tableBox').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  const {lo, hi} = _range;
  const slice = _all.slice(lo, hi+1);
  const stats = aggregate(slice);
  const models = Object.keys(stats);
  const sel = hi - lo + 1;
  document.getElementById('subtitle').textContent =
    `${scopeName} · 选中 #${lo+1}~#${hi+1}（${sel}/${N} 次）· ${models.length} 个端点`;
  document.getElementById('tableScope').textContent = `（#${lo+1} ~ #${hi+1}）`;
  if(!models.length){
    document.getElementById('legend').innerHTML = '';
    document.getElementById('chartBox').innerHTML = '<div class="empty">该范围内无调用记录</div>';
    document.getElementById('tableBox').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }
  renderLegend(models, stats);
  renderChart(models, stats);
  renderTable(models, stats);
}

function renderLegend(models, stats){
  const el = document.getElementById('legend');
  el.innerHTML = models.map((m,i)=>{
    const off = _hidden.has(m) ? ' off' : '';
    const cr = stats[m].cache_rate;
    return `<span class="item${off}" data-i="${i}" onclick="toggleModel(${i}, this)">`
      + `<span class="swatch" style="background:${modelColor(models,m)}"></span>${esc(m)}`
      + (cr != null ? ` <span class="dim">(${cr}%)</span>` : '')
      + `</span>`;
  }).join('');
}
function toggleModel(i, el){
  const models = Object.keys(aggregate(_all.slice(_range.lo, _range.hi+1)));
  const m = models[i];
  if(m){ if(_hidden.has(m)) _hidden.delete(m); else _hidden.add(m); }
  render();
}

function renderChart(models, stats){
  const box = document.getElementById('chartBox');
  const visible = models.filter(m=>!_hidden.has(m) && (stats[m].pts||[]).length);
  if(!visible.length){
    box.innerHTML = '<div class="empty">无可绘制的缓存命中数据（模型未返回 cached_tokens？）</div>';
    return;
  }
  const N = _all.length, {lo, hi} = _range;
  // —— x 轴 = 窗口 [lo,hi] 铺满绘图区：拖滑块即缩放，选中段数据占满整个图宽 ——
  const W = 900, H = 320, padL = 44, padR = 16, padT = 14, padB = 30;
  const span = hi - lo;
  const x = gi => padL + (gi - lo) / (span || 1) * (W - padL - padR);
  const y = rate => H - padB - rate / 100 * (H - padT - padB);
  let g = '';
  for(let p=0;p<=100;p+=20){
    const yy = y(p);
    g += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#21262d" stroke-width="1"/>`;
    g += `<text x="${padL-6}" y="${yy+4}" fill="#8b949e" font-size="11" text-anchor="end">${p}%</text>`;
  }
  // x 轴刻度：窗口 [lo,hi] 内 5 档等距，显示全局序号；具体时间看点的 tooltip
  const tickIdx = [...new Set([0,.25,.5,.75,1].map(f=>Math.round(f*span)+lo))];
  for(const t of tickIdx){
    const xx = x(t);
    g += `<text x="${xx.toFixed(1)}" y="${H-8}" fill="#8b949e" font-size="11" `
      + (t===lo?'':'text-anchor="middle"') + `>#${t+1}</text>`;
  }
  for(const m of visible){
    const pts = stats[m].pts;
    const col = modelColor(models, m);
    const line = pts.map(p=>`${x(p.gi).toFixed(1)},${y(p.rate).toFixed(1)}`).join(' ');
    g += `<polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.8" opacity="0.9"/>`;
    const r = pts.length > 300 ? 1.2 : (pts.length > 120 ? 1.8 : 2.5);
    for(const p of pts){
      const sc = p.scene ? ` · ${esc(p.scene)}` : '';
      g += `<circle cx="${x(p.gi).toFixed(1)}" cy="${y(p.rate).toFixed(1)}" r="${r}" fill="${col}">`
        + `<title>${esc(m)} · #${p.gi+1}${sc}\n${fmtTs(p.ts)}\n命中率 ${p.rate}%（cached ${fmtK(p.cached)} / prompt ${fmtK(p.prompt)} tokens）</title></circle>`;
    }
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

function renderTable(models, stats){
  let h = `<table><thead><tr>
    <th>端点</th><th>调用</th><th>成功</th><th>成功率</th><th>空</th><th>截断</th>
    <th>错误</th><th>缓存命中率</th><th>cached/prompt</th><th>tokens</th><th>均耗时</th>
  </tr></thead><tbody>`;
  for(const m of models){
    const s = stats[m];
    const sr = s.calls ? Math.round(s.success/s.calls*100) : 0;
    const errStr = Object.entries(s.errors||{}).map(([k,v])=>`${k}:${v}`).join(', ') || '—';
    const cr = s.cache_rate != null ? `<span class="${rateCls(s.cache_rate)}">${s.cache_rate}%</span>` : '<span class="dim">—</span>';
    const cp = s.prompt ? `${fmtK(s.cached)}/${fmtK(s.prompt)}` : '<span class="dim">—</span>';
    h += `<tr>
      <td><span style="color:${modelColor(models,m)}">●</span> ${esc(m)}</td>
      <td>${s.calls}</td><td>${s.success}</td>
      <td><span class="${rateCls(sr)}">${sr}%</span></td>
      <td>${s.empty||'—'}</td><td>${s.truncated||'—'}</td>
      <td>${errStr}</td>
      <td>${cr}</td><td class="dim">${cp}</td>
      <td>${fmtK(s.tokens)}</td><td>${s.avg_latency}s</td>
    </tr>`;
  }
  h += '</tbody></table>';
  document.getElementById('tableBox').innerHTML = h;
}

// ===== 双滑块 =====
function setupSlider(N){
  const rLo = document.getElementById('rLo'), rHi = document.getElementById('rHi');
  const last = Math.max(N-1, 0);
  rLo.disabled = rHi.disabled = N < 2;
  rLo.max = rHi.max = last;
  rLo.value = _range.lo; rHi.value = _range.hi;
  updateSliderUI();
}
function updateSliderUI(){
  const N = _all.length, last = Math.max(N-1,0);
  const lo = +document.getElementById('rLo').value, hi = +document.getElementById('rHi').value;
  _range = {lo, hi};
  const fill = document.getElementById('rangeFill');
  fill.style.left = (lo/(last||1)*100).toFixed(2)+'%';
  fill.style.width = (((hi-lo)/(last||1))*100).toFixed(2)+'%';
  document.getElementById('rangeLabel').innerHTML =
    `<b>#${lo+1}</b> ~ <b>#${hi+1}</b> <span style="opacity:.7">/ ${N}</span>`;
}
function onSlide(){
  const rLo = document.getElementById('rLo'), rHi = document.getElementById('rHi');
  // clamp：lo 不得超过 hi
  if(+rLo.value > +rHi.value){
    if(document.activeElement === rLo) rHi.value = rLo.value; else rLo.value = rHi.value;
  }
  _rangeTouched = true;
  updateSliderUI();
  render();
}
document.getElementById('rLo').addEventListener('input', onSlide);
document.getElementById('rHi').addEventListener('input', onSlide);
document.getElementById('btnResetRange').onclick = ()=>{
  _range = {lo:0, hi:Math.max(_all.length-1,0)};
  document.getElementById('rLo').value = _range.lo;
  document.getElementById('rHi').value = _range.hi;
  updateSliderUI(); render();
};

document.getElementById('scopeSel').onchange = load;
document.getElementById('btnRefresh').onclick = load;
load();
setInterval(load, 30000);   // 30s 自动刷新（拖过滑块则保留窗口）
</script>
</body>
</html>
